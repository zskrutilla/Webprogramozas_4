<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>6. feladat - Generikus függvény</title>
</head>

<body>
    <h1>6. feladat - Generikus</h1>

    <div>
        <h3>Számok</h3>
        <textarea id="nums" placeholder="pl. 1,2,3"></textarea>
        <div>Eredmény: <span id="resNum">-</span></div>
    </div>
    <div>
        <h3>Szövegek</h3>
        <textarea id="strings" placeholder='pl. "piros","zöld","kék"'></textarea>
        <div>Eredmény: <span id="resStr">-</span></div>
    </div>
    <div>
        <h3>Objektumok</h3>
        <textarea id="objs" placeholder='{ "nev": "Anna" }, { "nev": "Béla" }'></textarea>
        <div>Eredmény: <span id="resObj">-</span></div>
    </div>
</body>
<script src="./main.js"></script>

</html>
