<!doctype html>
<html lang="hu" ng-app="app3">

<head>
    <meta charset="utf-8" />
    <title>Esemény-regisztráció – AngularJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
</head>

<body ng-controller="Reg as vm" class="bg-light">
    <div class="container py-4">
        <h1 class="mb-4">Esemény-regisztráció</h1>

        <div class="row g-4">
            <div class="col-md-6">
                <form class="card card-body shadow-sm">
                    <div class="mb-3">
                        <label class="form-label">Név</label>
                        <input class="form-control" ng-model="vm.name" placeholder="Neved">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dátum</label>
                        <input type="date" class="form-control" ng-model="vm.date">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jegytípus</label>
                        <select class="form-select" ng-model="vm.ticket" ng-options="t as t.name for t in vm.tickets"> 
                            <!-- ez nem egy “for-ciklus” a JS-ben, hanem az AngularJS ng-options direktívájának mintája, ami <select> opciókat generál egy 
                            tömbből/kollekcióból — és közben megmondod,
                                mi legyen a modell értéke (amit az ng-model kap),
                                mi legyen a megjelenített címke (amit a felhasználó lát),
                                és miből jöjjenek az elemek. -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Alapár (Ft)</label>
                        <input type="number" min="0" class="form-control" ng-model="vm.basePrice"
                            placeholder="pl. 8000">
                    </div>
                </form>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header"><strong>Összegzés</strong></div>
                    <div class="card-body">
                        <p class="mb-2"><strong>Név:</strong> {{ vm.name || 'ismeretlen' }}</p>
                        <p class="mb-2"><strong>Dátum:</strong> {{ vm.date || 'nincs kiválasztva' }}</p>
                        <p class="mb-2"><strong>Jegytípus:</strong> {{ vm.ticket.name }}</p>
                        <hr>
                        <p class="mb-1">Kedvezmény/szorzó: {{ vm.ticket.note }}</p>
                        <h4 class="text-success">Végső ár: {{ vm.finalPrice() | number:0 }} Ft</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        angular.module('app3', [])
            .controller('Reg', function () {
                var vm = this;
                vm.basePrice = 8000;
                vm.tickets = [
                    { name: 'Alap', factor: 1.00, note: '0%' },     //Ez egy adatmodell: egy tömb (array) “jegytípus” objektumokkal. 
                                                                    //Minden elem három mezőt tartalmaz – ezeket a nézet (select), és a számítás (végső ár) használja.
                    { name: 'Diák', factor: 0.80, note: '-20%' },
                    { name: 'VIP', factor: 1.50, note: '+50%' }
                ];
                vm.ticket = vm.tickets[0];

                vm.finalPrice = function () {
                    var base = Math.max(0, +vm.basePrice || 0);
                    return Math.round(base * (vm.ticket?.factor || 1));
                };
            });
    </script>
</body>

</html>
