<!doctype html>
<html lang="hu" ng-app="app4">

<head>
    <meta charset="utf-8" />
    <title>Teendőlista – AngularJS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
</head>

<body ng-controller="Todos as vm" class="bg-light">
    <div class="container py-4">
        <h1 class="mb-4">Teendőlista</h1>

        <div class="row g-3">
            <div class="col-md-8">
                <form class="input-group" ng-submit="vm.add()">
                    <input class="form-control" ng-model="vm.newText" placeholder="Új teendő…">
                    <button class="btn btn-primary">Hozzáad</button>
                </form>
            </div>
            <div class="col-md-4">
                <input class="form-control" ng-model="vm.query" placeholder="Szűrő…">
            </div>
        </div>

        <div class="card shadow-sm mt-3">
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex align-items-center" ng-repeat="t in vm.items | filter:vm.search">
                    <input class="form-check-input me-2" type="checkbox" ng-model="t.done">
                    <span ng-class="{'text-decoration-line-through text-muted': t.done}">{{ t.text }}</span>
                    <button class="btn btn-sm btn-outline-danger ms-auto" ng-click="vm.remove($index)">Törlés</button>
                </li>
                <li class="list-group-item text-muted" ng-if="(vm.items | filter:vm.search).length===0">
                    Nincs találat.
                </li>
            </ul>
            <div class="card-footer d-flex justify-content-between">
                <span>Kész: {{ (vm.items | filter:{done:true}).length }} / {{ vm.items.length }}</span>
                <button class="btn btn-sm btn-outline-secondary" ng-click="vm.clearDone()"
                    ng-disabled="(vm.items | filter:{done:true}).length===0">
                    Kész elemek törlése
                </button>
            </div>
        </div>
    </div>

    <script>
        angular.module('app4', [])
            .controller('Todos', function () {
                var vm = this;
                vm.items = [{ text: 'AngularJS demó', done: false }, { text: 'Bootstrap lista', done: true }];
                vm.newText = ''; vm.query = '';

                vm.add = function () {
                    if (!vm.newText) return;
                    vm.items.push({ text: vm.newText, done: false });
                    vm.newText = '';
                };
                vm.remove = function (i) { vm.items.splice(i, 1); };
                vm.search = function (item) {
                    if (!vm.query) return true;
                    return item.text.toLowerCase().includes(vm.query.toLowerCase());
                };
                vm.clearDone = function () {
                    vm.items = vm.items.filter(i => !i.done);
                };
            });
    </script>
</body>

</html>
