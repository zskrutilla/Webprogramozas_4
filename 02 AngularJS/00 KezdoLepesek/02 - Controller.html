<!doctype html>
<html lang="hu" ng-app="app2">

<head>
  <meta charset="utf-8">
  <title>02 – Modul + ControllerAs</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 container" ng-controller="Main as vm">
  <h1 class="mb-3">ControllerAs minta</h1>

  <input class="form-control" ng-model="vm.user.name" placeholder="Név">
  <p class="mt-2">Helló, {{ vm.user.name || 'ismeretlen' }}!</p>

  <pre class="bg-light p-2 mt-3">{{ vm.user | json }}</pre>

  <script>
    angular.module('app2', [])
      .controller('Main', function () {
        var vm = this;
        vm.user = { name: '' };
      });
  </script>
</body>

</html>
