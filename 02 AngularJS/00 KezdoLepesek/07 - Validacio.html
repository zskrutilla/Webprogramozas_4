<!doctype html>
<html lang="hu" ng-app="app7">

<head>
    <meta charset="utf-8">
    <title>07 – Űrlap validáció</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 container" ng-controller="FormDemo as vm">
    <h1 class="mb-3">Űrlap validáció</h1>

    <form name="f" novalidate ng-submit="vm.save()">
        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input name="em" type="email" class="form-control" ng-model="vm.email" required>
            <div class="form-text text-danger" ng-if="f.em.$touched && f.em.$invalid"> /*A f.em.$touched azt jelzi, hogy a mezőre fókuszáltak-e már, a f.em.$invalid pedig azt, hogy érvénytelen-e a mező. Ha mindkettő igaz, akkor megjelenik a hibaüzenet. */ 
                Adj meg érvényes e-mail címet!
            </div>
        </div>
        <button class="btn btn-primary" ng-disabled="f.$invalid">Mentés</button>
    </form>

    <p class="mt-3" ng-if="vm.saved" class="text-success">Elmentve: {{ vm.email }}</p>

    <script>
        angular.module('app7', [])
            .controller('FormDemo', function () {
                var vm = this;
                vm.save = function () { vm.saved = true; };
            });
    </script>
</body>

</html>
