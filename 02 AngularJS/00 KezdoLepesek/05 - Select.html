<!doctype html>
<html lang="hu" ng-app="app5">

<head>
    <meta charset="utf-8">
    <title>05 – ng-options objektummal</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 container" ng-controller="Tickets as vm">
    <h1 class="mb-3">ng-options – objektum érték</h1>

    <select class="form-select" ng-model="vm.ticket" ng-options="t as t.name for t in vm.tickets">
        <option value="">– válassz jegyet –</option>
    </select>

    <div class="card card-body mt-3">
        <p><strong>Név:</strong> {{ vm.ticket.name || '—' }}</p>
        <p><strong>Szorzó:</strong> {{ vm.ticket.factor || '—' }}</p>
        <p><strong>Megjegyzés:</strong> {{ vm.ticket.note || '—' }}</p>
    </div>

    <script>
        angular.module('app5', [])
            .controller('Tickets', function () {
                var vm = this;
                vm.tickets = [
                    { name: 'Alap', factor: 1.00, note: '0%' },
                    { name: 'Diák', factor: 0.80, note: '-20%' },
                    { name: 'VIP', factor: 1.50, note: '+50%' }
                ];
                vm.ticket = vm.tickets[0]; // alapértelmezett kiválasztás
            });
    </script>
</body>

</html>
