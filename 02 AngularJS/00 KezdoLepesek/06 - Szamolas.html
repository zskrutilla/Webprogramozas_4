<!doctype html>
<html lang="hu" ng-app="app6">

<head>
    <meta charset="utf-8">
    <title>06 – Biztonságos számolás (nettó→bruttó)</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 container" ng-controller="Calc as vm">
    <h1 class="mb-3">Nettó → Bruttó (élő számítás)</h1>

    <div class="row g-3">
        <div class="col-md-4">
            <label class="form-label">Nettó ár (Ft)</label>
            <input type="number" class="form-control" ng-model="vm.net" placeholder="pl. 10000">
        </div>
        <div class="col-md-4">
            <label class="form-label">Mennyiség (db)</label>
            <input type="number" class="form-control" ng-model="vm.qty" placeholder="pl. 2">
        </div>
        <div class="col-md-4">
            <label class="form-label">ÁFA (%)</label>
            <input type="number" class="form-control" ng-model="vm.vat" placeholder="pl. 27">
        </div>
    </div>

    <div class="card card-body mt-3">
        <p>Nettó összesen: <strong>{{ vm.netTotal() | number:0 }}</strong> Ft</p>
        <p>ÁFA összege: <strong>{{ vm.vatAmount() | number:0 }}</strong> Ft</p>
        <p class="mb-0">Bruttó: <strong class="text-success">{{ vm.gross() | number:0 }}</strong> Ft</p>
    </div>

    <script>
        angular.module('app6', [])
            .controller('Calc', function () {
                var vm = this;
                vm.net = 10000; vm.qty = 1; vm.vat = 27;

                vm.netTotal = function () {
                    var n = Math.max(0, +vm.net || 0); // + → Number; falsy→0; clamp 0 alá nem mehet
                    var q = Math.max(0, +vm.qty || 0);
                    return n * q;
                };
                vm.vatAmount = function () {
                    var base = vm.netTotal();
                    var v = Math.max(0, +vm.vat || 0) / 100;
                    return base * v;
                };
                vm.gross = function () {
                    return vm.netTotal() + vm.vatAmount();
                };
            });
    </script>
</body>

</html>
