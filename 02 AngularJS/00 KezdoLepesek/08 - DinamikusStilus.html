<!doctype html>
<html lang="hu" ng-app="app8">

<head>
    <meta charset="utf-8">
    <title>08 – ng-style (szín előnézet)</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .box {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
    </style>
</head>

<body class="p-4 container" ng-controller="ColorDemo as vm">
    <h1 class="mb-3">Szín előnézet</h1>

    <select class="form-select" ng-model="vm.sel" ng-options="c as c.name for c in vm.colors"></select>

    <div class="d-flex align-items-center gap-3 mt-3">
        <div class="box" ng-style="{ background: vm.sel.hex }"></div>
        <div>
            <div><strong>{{ vm.sel.name }}</strong></div>
            <small class="text-muted">{{ vm.sel.hex }}</small>
        </div>
    </div>

    <script>
        angular.module('app8', [])
            .controller('ColorDemo', function () {
                var vm = this;
                vm.colors = [
                    { name: 'Fehér', hex: '#ffffff' },
                    { name: 'Fekete', hex: '#000000' },
                    { name: 'Kék', hex: '#0d6efd' }
                ];
                vm.sel = vm.colors[0];
            });
    </script>
</body>

</html>
