<!doctype html>
<html lang="hu" ng-app="app3">

<head>
    <meta charset="utf-8">
    <title>03 – ng-click & ng-submit</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 container" ng-controller="Main as vm">
    <h1 class="mb-3">Események</h1>

    <form class="input-group" ng-submit="vm.add()">
        <input class="form-control" ng-model="vm.text" placeholder="Írj valamit…">
        <button class="btn btn-primary">Hozzáad</button>
    </form>

    <button class="btn btn-outline-secondary mt-2" ng-click="vm.clear()" ng-disabled="!vm.items.length">
        Lista ürítése
    </button>

    <ul class="mt-3">
        <li ng-repeat="it in vm.items track by $index">{{ it }}</li>
    </ul>

    <script>
        angular.module('app3', [])
            .controller('Main', function () {
                var vm = this;
                vm.items = [];
                vm.add = function () {
                    if (!vm.text) return;
                    vm.items.push(vm.text);
                    vm.text = '';
                };
                vm.clear = function () { vm.items = []; };
            });
    </script>
</body>

</html>
