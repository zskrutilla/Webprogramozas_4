<!doctype html>
<html lang="hu" ng-app="app4">

<head>
    <meta charset="utf-8">
    <title>04 – ng-repeat + filter</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4 container" ng-controller="Fruit as vm">
    <h1 class="mb-3">Lista + szűrés</h1>

    <input class="form-control" ng-model="vm.q" placeholder="Szűrő… (pl. 'a')">

    <ul class="mt-3 list-group">
        <li class="list-group-item" ng-repeat="f in vm.fruits | filter:vm.q">{{ f }}</li>
        <li class="list-group-item text-muted" ng-if="(vm.fruits | filter:vm.q).length===0">Nincs találat.</li>
    </ul>

    <script>
        angular.module('app4', [])
            .controller('Fruit', function () {
                var vm = this;
                vm.fruits = ['alma', 'banán', 'cseresznye', 'dinnye', 'eper', 'füge'];
            });
    </script>
</body>

</html>
