<!DOCTYPE html>
<html lang="en" ng-app="app2">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>02 - Modul + ContollerAs</title>
</head>

<body class="p-4 container" ng-controller="Main as vmCont">

    <h1 class="mb-3">ControllerAs minta</h1>

    <input class="form-control" ng-model="vmCont.user.name" placeholder="Név">
    <p class="mt-2">
        Helló, {{ vmCont.user.name || 'ismeretlen' }}!
    </p>
    <script>
        angular.module('app2', [])
            .controller('Main', function () {
                var vm = this;
                vm.user = { name: '' };
            });
    </script>
</body>

</html>
